<!doctype html><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(#6b90a5 0%,#b7c6cc 45%,#d1d6d3 70%,#6e8e9b 100%)}canvas{display:block;width:100%;height:100%;touch-action:none}#haze{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(30,63,81,.06),transparent 30%,rgba(180,202,207,.06) 60%,rgba(13,35,52,.30) 100%)}
</style></head><body><div id="haze"></div><script src="three.min.js"></script><script>
(function(){'use strict';
if(typeof THREE==='undefined'){return;} // CSS sky fallback when dependency is absent
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87a7b6);scene.fog=new THREE.FogExp2(0x9db4be,0.010);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,260);
const renderer=new THREE.WebGLRenderer({alpha:false,antialias:false,powerPreference:'low-power'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.insertBefore(renderer.domElement,document.body.firstChild);
scene.add(new THREE.HemisphereLight(0xe9f4ff,0x4b6170,2.1));const sun=new THREE.DirectionalLight(0xffe4c7,2.0);sun.position.set(-25,35,18);scene.add(sun);
// Procedural alpine relief: lightweight temporary scenery, not the final Elbrus model.
function relief(x,z,layer){const left=8.0*Math.exp(-Math.pow((x+8)/8,2));const right=10.0*Math.exp(-Math.pow((x-9)/7,2));const ridge=2.3*Math.exp(-Math.pow(x/16,2));const serration=(Math.sin(x*.9+z*.15)*.38+Math.sin(x*1.8-z*.22)*.18);const depth=1-.018*Math.abs(z);return Math.max(-1,(left+right+ridge+serration)*depth+layer);}
function mountain(offset,depth,color){const nx=100,nz=28,w=68,d=30;const pos=[],indices=[],colors=[];const stone=new THREE.Color(color);for(let j=0;j<=nz;j++){const z=-j*d/nz;for(let i=0;i<=nx;i++){const x=(i/nx-.5)*w;const y=relief(x,z,offset)+Math.sin(x*2.7+z*1.3)*.13;pos.push(x,y,z-depth);const snow=Math.max(0,Math.min(1,(y-(4+offset))*.42));const c=stone.clone().lerp(new THREE.Color(0xe7ebeb),snow);const rock=1-.13*Math.abs(Math.sin(x*1.3+z*2.1));c.multiplyScalar(rock);colors.push(c.r,c.g,c.b);}}
for(let j=0;j<nz;j++)for(let i=0;i<nx;i++){const a=j*(nx+1)+i,b=a+nx+1;indices.push(a,b,a+1,b,b+1,a+1);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));g.setIndex(indices);g.computeVertexNormals();scene.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide})));}
mountain(-3,37,0x758a94);mountain(-1.5,21,0x687d86);mountain(0,5,0x485a62);
const clock=new THREE.Clock();let frame=0;let visible=true;document.addEventListener('visibilitychange',()=>{visible=!document.hidden;if(visible)requestAnimationFrame(draw);});
/* Framing (Claude, 6.10): centred between the two front summits (x -6.2 and 8.3) and 4 units further back,
   so both stay on screen on tall 9:20 phones; drift amplitude/speed unchanged. */
function draw(){if(!visible)return;const t=clock.getElapsedTime();camera.position.set(1.05+Math.sin(t*.045)*.85,11.6+Math.sin(t*.03)*.14,46);camera.lookAt(1.05,4.6,-13);renderer.render(scene,camera);frame++;requestAnimationFrame(draw);}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}window.addEventListener('resize',resize);resize();draw();
})();
</script></body></html>
